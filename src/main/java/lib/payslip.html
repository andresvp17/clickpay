<!DOCTYPE html>
<html>
<head>
    <style>
        @page {
            size: A4;
            margin: 20mm;
            background-color: #000;
        }
        body {
            font-family: monospace, Arial, sans-serif;
            color: white;
            background-color: #000;
            font-size: 12px;
        }
        .header {
            border-bottom: 2px solid white;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .company-title {
            font-size: 20px;
            font-weight: bold;
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #2c3e50;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #2c3e50;
            font-weight: bold;
        }
        .text-right { text-align: right; }
        .total-row { font-weight: bold; background-color: #2c3e50; }
    </style>
</head>
<body>
    <div class="header">
        <img src="${companyLogo}" alt="Company Logo"/>
        <div class="company-title">ClickPay</div>
        <div>Recibo de Pago: ${payPeriod}</div>
    </div>

    <h3>Información del Empleado</h3>
    <p><strong>Nombre:</strong> ${employeeName} | <strong>ID:</strong> ${employeeId}</p>

    <h3>Percepciones &amp; Deducciones</h3>
    <table>
        <thead>
            <tr>
                <th>Descripción</th>
                <th class="text-right">Percepciones</th>
                <th class="text-right">Deducciones</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Salario Base</td>
                <td class="text-right">$${baseSalary}</td>
                <td class="text-right">-</td>
            </tr>
            <tr>
                <td>Impuesto sobre la Renta</td>
                <td class="text-right">-</td>
                <td class="text-right">$${taxDeduction}</td>
            </tr>
            <tr class="total-row">
                <td>Net Pay</td>
                <td colspan="2" class="text-right">$${netPay}</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
